<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Random Joke Generator - Get a fresh laugh every time!">
  <title>Joke Generator | EKEMP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1220;
      --muted: #64748b;
      --line: #e5e7eb;
      --bg: #f7f9fc;
      --blue: #155eef;
      --blue2: #0b3fbf;
      --white: #fff;
      --dark: #07111f;
      --radius: 24px;
      --shadow: 0 18px 50px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #f7fbff, #eef4ff);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(229, 231, 235, .8);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--blue2);
      transform: translateY(-2px);
    }

    .btn-secondary {
      border: 1px solid var(--line);
      background: #fff;
    }

    .btn-secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    main {
      padding: 80px 0;
    }

    .joke-container {
      background: #fff;
      border-radius: var(--radius);
      padding: 50px;
      box-shadow: var(--shadow);
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .joke-header {
      margin-bottom: 30px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .joke-container h1 {
      font-size: 42px;
      letter-spacing: -2px;
      line-height: 1.1;
      margin: 0 0 20px;
    }

    .joke-container p {
      color: var(--muted);
      font-size: 17px;
      margin: 0;
    }

    .joke-display {
      background: linear-gradient(135deg, #f7fbff, #eef4ff);
      border-radius: 20px;
      padding: 40px;
      margin: 40px 0;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .joke-text {
      font-size: 20px;
      color: var(--ink);
      line-height: 1.8;
      font-weight: 500;
      margin: 0;
    }

    .joke-setup {
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 15px;
    }

    .joke-punchline {
      color: #155eef;
      font-weight: 700;
      margin-top: 15px;
      font-style: italic;
    }

    .loading {
      color: var(--muted);
      font-style: italic;
    }

    .error {
      color: #dc2626;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .btn-large {
      padding: 14px 32px;
      font-size: 16px;
    }

    .joke-type {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px 0;
    }

    .joke-type button {
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: 0.3s;
    }

    .joke-type button:hover,
    .joke-type button.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    footer {
      background: #050b14;
      color: #c7d1df;
      padding: 40px 0 20px;
      text-align: center;
      margin-top: 80px;
    }

    .footer-content {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 13px;
    }

    .footer-links a {
      color: #91a0b5;
      transition: 0.3s;
    }

    .footer-links a:hover {
      color: var(--blue);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid var(--line);
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--blue);
      display: block;
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .joke-container {
        padding: 30px;
      }

      .joke-container h1 {
        font-size: 32px;
      }

      .joke-display {
        padding: 25px;
        min-height: 120px;
      }

      .joke-text {
        font-size: 17px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
      }

      .btn-large {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="logo" href="index.html">E<span>K</span>EMP</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="jokes.html" style="color: var(--blue); font-weight: 700;">Joke Generator</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="joke-container">
      <div class="joke-header">
        <div class="eyebrow">😄 Entertainment</div>
        <h1>Joke Generator</h1>
        <p>Get a random joke to brighten your day!</p>
      </div>

      <div class="joke-type">
        <button class="active" onclick="setJokeType('random')">Random</button>
        <button onclick="setJokeType('general')">General</button>
        <button onclick="setJokeType('programming')">Programming</button>
        <button onclick="setJokeType('knock-knock')">Knock-Knock</button>
      </div>

      <div class="joke-display" id="jokeDisplay">
        <p class="joke-text loading">Click the button below to get a joke!</p>
      </div>

      <div class="controls">
        <button class="btn btn-primary btn-large" onclick="getJoke()">Get a Joke 😂</button>
        <button class="btn btn-secondary btn-large" onclick="shareJoke()">Share Joke 🔗</button>
      </div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="jokeCount">0</span>
          <span class="stat-label">Jokes Loaded</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="avgLength">0</span>
          <span class="stat-label">Avg Characters</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="sessionTime">0s</span>
          <span class="stat-label">Session Time</span>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-content">© 2026 EKEMP. All rights reserved.</div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="#contact">Contact</a>
      <a href="#">Privacy</a>
    </div>
  </div>
</footer>

<script>
  let jokeType = 'random';
  let jokeCount = 0;
  let totalCharacters = 0;
  let sessionStartTime = Date.now();
  let currentJoke = '';

  function setJokeType(type) {
    jokeType = type;
    document.querySelectorAll('.joke-type button').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
  }

  async function getJoke() {
    const display = document.getElementById('jokeDisplay');
    display.innerHTML = '<p class="joke-text loading">Loading your joke... 🤔</p>';

    try {
      let url = '';

      if (jokeType === 'random') {
        url = 'https://official-joke-api.appspot.com/random_joke';
      } else if (jokeType === 'general') {
        url = 'https://official-joke-api.appspot.com/random_joke';
      } else if (jokeType === 'programming') {
        url = 'https://official-joke-api.appspot.com/jokes/programming/random';
      } else if (jokeType === 'knock-knock') {
        url = 'https://official-joke-api.appspot.com/jokes/knock-knock/random';
      }

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`API Error: ${response.status}`);
      }

      const data = await response.json();
      let jokeHtml = '';

      if (data.setup && data.punchline) {
        jokeHtml = `
          <div>
            <p class="joke-text joke-setup">${data.setup}</p>
            <p class="joke-text joke-punchline">${data.punchline}</p>
          </div>
        `;
        currentJoke = `${data.setup} ${data.punchline}`;
      } else if (data.joke) {
        jokeHtml = `<p class="joke-text">${data.joke}</p>`;
        currentJoke = data.joke;
      }

      if (jokeHtml) {
        display.innerHTML = jokeHtml;
        jokeCount++;
        totalCharacters += currentJoke.length;
        updateStats();
      } else {
        throw new Error('Unexpected API response format');
      }
    } catch (error) {
      console.error('Error:', error);
      display.innerHTML = `
        <div>
          <p class="joke-text error">Oops! Could not load a joke. 😞</p>
          <p class="joke-text" style="color: var(--muted); font-size: 14px; margin-top: 10px;">
            Error: ${error.message}
          </p>
        </div>
      `;
    }
  }

  function shareJoke() {
    if (!currentJoke) {
      alert('Get a joke first!');
      return;
    }

    const text = `Check out this joke: "${currentJoke}" - from EKEMP Joke Generator 😂`;
    
    if (navigator.share) {
      navigator.share({
        title: 'EKEMP Joke Generator',
        text: text
      }).catch(err => console.log('Error sharing:', err));
    } else {
      navigator.clipboard.writeText(text).then(() => {
        alert('Joke copied to clipboard! 📋');
      }).catch(() => {
        alert(text);
      });
    }
  }

  function updateStats() {
    document.getElementById('jokeCount').textContent = jokeCount;
    document.getElementById('avgLength').textContent = jokeCount > 0 
      ? Math.round(totalCharacters / jokeCount) 
      : 0;

    const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
    document.getElementById('sessionTime').textContent = elapsed + 's';
  }

  setInterval(updateStats, 1000);
</script>
</body>
</html>
